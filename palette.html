<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Rydon Palette</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;font-family:monospace;padding:40px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.swatch{display:flex;align-items:center;gap:16px;cursor:pointer}
.box{width:80px;height:80px;border-radius:12px}
.info{color:#fff}
.name{font-size:14px;font-weight:bold;margin-bottom:4px}
.hex{font-size:18px;color:#aaa}
h2{color:#fff;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;margin-top:16px}
</style>
</head>
<body>
<h2>Rydon Teal — Brand Colors</h2>

<div class="swatch"><div class="box" style="background:#e6f7f9"></div><div class="info"><div class="name">Pale</div><div class="hex">#e6f7f9</div></div></div>
<div class="swatch"><div class="box" style="background:#cff4f8"></div><div class="info"><div class="name">Light</div><div class="hex">#cff4f8</div></div></div>
<div class="swatch"><div class="box" style="background:#08bfd1"></div><div class="info"><div class="name">Mid</div><div class="hex">#08bfd1</div></div></div>
<div class="swatch"><div class="box" style="background:#06a2b4;outline:3px solid #fff;outline-offset:3px"></div><div class="info"><div class="name">★ PRIMARY</div><div class="hex">#06a2b4</div></div></div>
<div class="swatch"><div class="box" style="background:#047a88"></div><div class="info"><div class="name">Dark</div><div class="hex">#047a88</div></div></div>
<div class="swatch"><div class="box" style="background:#035f6b"></div><div class="info"><div class="name">Deeper</div><div class="hex">#035f6b</div></div></div>
<div class="swatch"><div class="box" style="background:#012d34"></div><div class="info"><div class="name">Darkest</div><div class="hex">#012d34</div></div></div>

</body>
</html>
