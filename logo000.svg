<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 200 200" width="200" height="200"
     version="1.2" baseProfile="tiny-ps">
  <title>RYDON Ghana</title>

  <!-- Black circle background -->
  <circle cx="100" cy="100" r="100" fill="#000000"/>

  <!-- Car body -->
  <rect x="38" y="105" width="124" height="38" rx="8" fill="#ffffff"/>

  <!-- Car roof / cabin -->
  <path d="M62 105 L75 78 Q78 72 85 72 L115 72 Q122 72 125 78 L138 105 Z"
        fill="#ffffff"/>

  <!-- Windshield (dark) -->
  <path d="M80 105 L89 82 Q91 78 95 78 L105 78 Q109 78 111 82 L120 105 Z"
        fill="#000000" opacity="0.6"/>

  <!-- Left wheel -->
  <circle cx="66" cy="145" r="16" fill="#000000"/>
  <circle cx="66" cy="145" r="8"  fill="#ffffff"/>

  <!-- Right wheel -->
  <circle cx="134" cy="145" r="16" fill="#000000"/>
  <circle cx="134" cy="145" r="8"  fill="#ffffff"/>

  <!-- Headlight right -->
  <rect x="152" y="112" width="10" height="7" rx="3" fill="#FFD700"/>

  <!-- Taillight left -->
  <rect x="38"  y="112" width="10" height="7" rx="3" fill="#FF4444"/>

  <!-- Brand name -->
  <text x="100" y="185"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="bold"
        fill="#ffffff" text-anchor="middle"
        letter-spacing="1">RYDON</text>
</svg>
