<!DOCTYPE html>
<html lang="en-GH">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Get the Rydon App</title>
<meta name="description" content="Download Rydon — Ghana's ride, Okada and delivery app. iPhone on the App Store; Google Play coming soon."/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#0B6E6E"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<script>
  // Instant device routing — runs before the page renders so there is no blank wait.
  (function(){
    var APPLE = "https://apps.apple.com/app/id6795666932";
    var PLAY  = ""; // set to the Play listing URL once it is public
    var ua = navigator.userAgent || navigator.vendor || "";
    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream && APPLE) { location.replace(APPLE); }
    else if (/android/i.test(ua) && PLAY) { location.replace(PLAY); }
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root{--teal:#0E8C8C;--teal-deep:#0B6E6E;--coral:#E8653F;--gold:#F4C542;--ink:#0b2b2b}
  *{margin:0;padding:0;box-sizing:border-box;font-family:Montserrat,system-ui,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;overflow-x:hidden;
    background:radial-gradient(1000px 700px at 50% -10%,#12A3A3,#0E8C8C 45%,#0B6E6E 100%);color:#fff;text-align:center}
  .card{width:100%;max-width:420px}
  .badge{width:92px;height:92px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 14px 40px rgba(0,0,0,.28);overflow:hidden}
  .badge img{width:92px;height:92px;object-fit:contain}
  h1{font-weight:900;font-size:clamp(26px,7vw,38px);letter-spacing:-1px;margin-top:22px;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
  .sub{font-weight:600;font-size:16px;opacity:.92;margin-top:10px}
  .slogan{font-weight:800;font-size:15px;color:var(--gold);margin-top:6px}
  .btns{display:flex;flex-direction:column;gap:12px;margin-top:28px}
  .btn{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 20px;border-radius:16px;font-weight:800;font-size:17px;text-decoration:none}
  .btn svg{width:26px;height:26px;flex:none}
  .ios{background:#fff;color:var(--ink)} .ios svg{fill:var(--ink)}
  .android{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28)} .android svg{fill:#fff}
  .android.soon{opacity:.72;pointer-events:none}
  .soonpill{font-weight:700;font-size:12px;background:var(--coral);color:#fff;padding:3px 9px;border-radius:999px;margin-left:6px}
  .wait{display:inline-block;margin-top:22px;font-weight:700;font-size:15px;color:#fff;text-decoration:underline;text-underline-offset:3px}
  a{color:#fff}
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><img src="/apple-touch-icon.png" alt="Rydon"/></div>
    <h1>Get the Rydon app</h1>
    <div class="sub">Rides &middot; Okada &middot; Food &amp; grocery delivery</div>
    <div class="slogan">Everyday Life. Made Easier.</div>
    <div class="btns">
      <a class="btn ios" href="https://apps.apple.com/app/id6795666932">
        <svg viewBox="0 0 24 24"><path d="M17.05 12.04c-.03-2.85 2.33-4.22 2.44-4.29-1.33-1.95-3.4-2.21-4.13-2.24-1.76-.18-3.43 1.03-4.32 1.03-.89 0-2.26-1.01-3.72-.98-1.91.03-3.68 1.11-4.66 2.82-1.99 3.45-.51 8.55 1.42 11.35.94 1.37 2.06 2.9 3.53 2.85 1.42-.06 1.95-.92 3.66-.92 1.71 0 2.19.92 3.69.89 1.53-.03 2.49-1.39 3.42-2.77 1.08-1.59 1.52-3.13 1.55-3.21-.03-.02-2.97-1.14-3-4.4zM14.3 4.55c.78-.95 1.31-2.27 1.17-3.58-1.13.05-2.49.75-3.3 1.7-.73.84-1.36 2.18-1.19 3.47 1.26.1 2.54-.64 3.32-1.59z"/></svg>
        Download on the App Store
      </a>
      <a class="btn android soon" href="#">
        <svg viewBox="0 0 24 24"><path d="M3.6 2.3c-.3.3-.5.7-.5 1.2v17c0 .5.2.9.5 1.2l.1.1 9.5-9.5v-.2L3.7 2.2zm12.9 12.7l-3.2-3.2 3.2-3.2 3.8 2.2c1.1.6 1.1 1.7 0 2.3zm-3.9-2.9l3.1 3.1-9.3 5.3zm0-1.8L5.3 4.3l8.1 4.6z"/></svg>
        <span>Google Play<span class="soonpill">Coming soon</span></span>
      </a>
    </div>
    <a class="wait" href="https://wa.me/233539246990?text=Hi%20Rydon%2C%20add%20me%20to%20the%20Kumasi%20waitlist">Not launched near you? Join the waitlist &rarr;</a>
  </div>
</body>
</html>
